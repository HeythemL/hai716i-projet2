[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tournoi-prisonnier"
version = "0.1.0"
description = "Tournoi round-robin pour le dilemme du prisonnier itéré"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]